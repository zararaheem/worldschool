<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Alpha World School Guide Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1c1917;--bg2:#292524;--bg3:#3c3330;
  --border:#44403c;--border2:#57534e;
  --text:#e7e5e4;--muted:#a8a29e;--dim:#78716c;
  --amber:#f59e0b;--amber-light:#fcd34d;
  --green:#4ade80;--rose:#fb7185;
  --radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px}
.login-box .logo{background:var(--amber);color:#111;font-weight:900;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:6px;text-transform:uppercase;display:inline-block;margin-bottom:20px}
.login-box h1{font-size:20px;font-weight:800;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-bottom:12px;transition:border-color .15s}
.login-box input:focus{border-color:var(--amber)}
.login-box button{width:100%;padding:12px;border-radius:var(--radius);background:var(--amber);color:#111;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:none;transition:background .15s}
.login-box button:hover{background:var(--amber-light)}
.login-err{font-size:12px;color:var(--rose);margin-top:8px;display:none}
/* Dashboard */
#dashboard{display:none}
header{background:#111827;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo-sm{background:var(--amber);color:#111;font-weight:900;font-size:11px;letter-spacing:.08em;padding:4px 8px;border-radius:5px;text-transform:uppercase}
header h1{font-size:14px;font-weight:700;color:var(--muted)}
.logout-btn{margin-left:auto;font-size:12px;color:var(--dim);background:none;border:1px solid var(--border);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s}
.logout-btn:hover{color:var(--text);border-color:var(--border2)}
/* Controls */
.controls{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg2)}
.controls input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-family:inherit;font-size:13px;outline:none;width:220px;transition:border-color .15s}
.controls input:focus{border-color:var(--amber)}
.controls select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;cursor:pointer}
.count{font-size:12px;color:var(--dim);margin-left:auto}
.refresh-btn{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);padding:6px 14px;border-radius:7px;cursor:pointer;font-family:inherit}
.refresh-btn:hover{border-color:var(--border2);color:var(--text)}
/* Table */
.table-wrap{overflow-x:auto;padding:0 24px 40px}
table{width:100%;border-collapse:collapse;margin-top:16px;min-width:700px}
thead th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--muted)}
thead th .sort-arrow{margin-left:4px;opacity:.5}
tbody tr{border-bottom:1px solid rgba(68,64,60,.5);transition:background .1s;cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody td{padding:10px 12px;font-size:13px;vertical-align:middle}
.td-name{font-weight:600;color:var(--text)}
.td-role{color:var(--muted)}
.td-campus{color:var(--dim)}
.status-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(120,113,108,.2);color:var(--dim)}
.status-badge.new{background:rgba(245,158,11,.15);color:var(--amber)}
.status-badge.reviewed{background:rgba(74,222,128,.1);color:var(--green)}
.status-badge.rejected{background:rgba(251,113,133,.1);color:var(--rose)}
.builds-done{font-size:11px;color:var(--dim)}
.builds-done span{color:var(--green)}
/* Empty / loading */
.state-row td{text-align:center;padding:40px;color:var(--dim)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;padding:32px}
.modal-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:20px;font-weight:800}
.modal-header p{font-size:13px;color:var(--muted);margin-top:2px}
.close-btn{margin-left:auto;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.close-btn:hover{color:var(--text)}
.modal-section{margin-bottom:20px}
.modal-section h3{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.detail-grid{grid-template-columns:1fr}}
.detail-item{}
.detail-item .dl{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.detail-item .dv{font-size:13px;color:var(--text)}
.detail-item .dv a{color:var(--amber);word-break:break-all}
.detail-item.full{grid-column:1/-1}
.ack-list-m{list-style:none;display:flex;flex-direction:column;gap:4px}
.ack-list-m li{font-size:12px;color:var(--muted);display:flex;gap:6px}
.ack-list-m li::before{content:"✓";color:var(--green);flex-shrink:0}
.status-select{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:12px;outline:none;cursor:pointer;margin-right:8px}
.note-area{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;resize:none;outline:none;margin-top:8px;transition:border-color .15s}
.note-area:focus{border-color:var(--amber)}
.save-btn{margin-top:8px;padding:7px 16px;background:var(--amber);color:#111;font-weight:700;font-size:12px;border:none;border-radius:7px;cursor:pointer;font-family:inherit}
.save-btn:hover{background:var(--amber-light)}
.saved-msg{font-size:11px;color:var(--green);margin-left:10px;opacity:0;transition:opacity .3s}
.saved-msg.show{opacity:1}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">AWS</div>
    <h1>Admin Dashboard</h1>
    <p>Guide Applications 2026–27</p>
    <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password" />
    <div class="login-err" id="login-err">Incorrect password.</div>
    <button id="login-btn">Sign In</button>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <header>
    <div class="logo-sm">AWS</div>
    <h1>Guide Applications — Admin</h1>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-left:auto;margin-right:12px">
      <span id="live-dot" style="width:8px;height:8px;border-radius:50%;background:#78716c;flex-shrink:0"></span>
      <span id="live-label" style="color:#78716c">Connecting…</span>
    </div>
    <button class="logout-btn" id="logout-btn">Sign out</button>
  </header>
  <div id="new-banner" style="display:none;align-items:center;justify-content:space-between;padding:10px 24px;background:rgba(74,222,128,.1);border-bottom:1px solid rgba(74,222,128,.3)">
    <span id="new-count" style="font-size:13px;color:#86efac;font-weight:600"></span>
    <button onclick="document.getElementById('new-banner').style.display='none'" style="font-size:11px;color:#4ade80;background:none;border:none;cursor:pointer">Dismiss</button>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search name, email, campus…" />
    <select id="status-filter">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="reviewed">Reviewed</option>
      <option value="rejected">Rejected</option>
    </select>
    <button class="refresh-btn" id="refresh-btn">↺ Refresh</button>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-col="full_name">Name <span class="sort-arrow">↕</span></th>
          <th data-col="role_at_alpha">Role</th>
          <th data-col="campus">Campus</th>
          <th data-col="created_at">Submitted <span class="sort-arrow">↕</span></th>
          <th data-col="status">Status</th>
          <th>Builds</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="state-row"><td colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Modal ── -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabase = createClient(
  'https://zbduxegkxhgyfvrfkgai.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiZHV4ZWdreGhneWZ2cmZrZ2FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTIzOTUsImV4cCI6MjA5MzIyODM5NX0.pTdpdvjkaWFPQdRm7k0xqtAxcUsMo015qRH2_H4spOk'
)

const PASSWORD = 'aws-2026'
let allRows = []
let sortCol = 'created_at'
let sortDir = -1

// ── Auth ──
const pwInput = document.getElementById('pw-input')
document.getElementById('login-btn').addEventListener('click', tryLogin)
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin() })

function tryLogin() {
  if (pwInput.value === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    loadData()
    startRealtime()
  } else {
    document.getElementById('login-err').style.display = 'block'
    pwInput.value = ''
    pwInput.focus()
  }
}

let realtimeChannel = null

document.getElementById('logout-btn').addEventListener('click', () => {
  if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null }
  document.getElementById('dashboard').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
  pwInput.value = ''
})

function startRealtime() {
  const dot = document.getElementById('live-dot')
  const lbl = document.getElementById('live-label')
  realtimeChannel = supabase
    .channel('guide_applications_live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guide_applications' }, (payload) => {
      allRows.unshift(payload.new)
      render()
      const banner = document.getElementById('new-banner')
      const cnt = parseInt(banner.dataset.count || '0') + 1
      banner.dataset.count = cnt
      banner.querySelector('#new-count').textContent = `${cnt} new application${cnt > 1 ? 's' : ''} received`
      banner.style.display = 'flex'
    })
    .subscribe((status) => {
      const live = status === 'SUBSCRIBED'
      dot.style.background = live ? '#4ade80' : '#78716c'
      lbl.textContent = live ? 'Live' : 'Connecting…'
      lbl.style.color = live ? '#4ade80' : '#78716c'
    })
}

// ── Data ──
async function loadData() {
  const tb = document.getElementById('table-body')
  tb.innerHTML = '<tr class="state-row"><td colspan="6">Loading…</td></tr>'

  const { data, error } = await supabase
    .from('guide_applications')
    .select('*')
    .order('created_at', { ascending: false })

  if (error) {
    tb.innerHTML = `<tr class="state-row"><td colspan="6">Error: ${error.message}</td></tr>`
    return
  }
  allRows = data || []
  render()
}

document.getElementById('refresh-btn').addEventListener('click', loadData)
document.getElementById('search').addEventListener('input', render)
document.getElementById('status-filter').addEventListener('change', render)

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col
    if (sortCol === col) sortDir *= -1
    else { sortCol = col; sortDir = -1 }
    render()
  })
})

function render() {
  const search = document.getElementById('search').value.toLowerCase()
  const statusFilter = document.getElementById('status-filter').value

  let rows = allRows.filter(r => {
    const matchSearch = !search ||
      (r.full_name || '').toLowerCase().includes(search) ||
      (r.email || '').toLowerCase().includes(search) ||
      (r.campus || '').toLowerCase().includes(search) ||
      (r.role_at_alpha || '').toLowerCase().includes(search)
    const matchStatus = !statusFilter || (r.status || 'new') === statusFilter
    return matchSearch && matchStatus
  })

  rows.sort((a, b) => {
    const av = a[sortCol] || ''
    const bv = b[sortCol] || ''
    return av < bv ? -sortDir : av > bv ? sortDir : 0
  })

  document.getElementById('count').textContent = `${rows.length} application${rows.length !== 1 ? 's' : ''}`

  const tb = document.getElementById('table-body')
  if (!rows.length) {
    tb.innerHTML = '<tr class="state-row"><td colspan="6">No applications found.</td></tr>'
    return
  }

  tb.innerHTML = rows.map(r => {
    const status = r.status || 'new'
    const builds = [r.build1_link, r.build2_design_link, r.build2_video_link, r.build3_video_link].filter(Boolean).length
    const date = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'
    return `<tr data-id="${r.id}">
      <td><div class="td-name">${esc(r.full_name || '—')}</div><div style="font-size:11px;color:var(--dim)">${esc(r.email || '')}</div></td>
      <td class="td-role">${esc(r.role_at_alpha || '—')}</td>
      <td class="td-campus">${esc(r.campus || '—')}</td>
      <td style="font-size:12px;color:var(--dim)">${date}</td>
      <td><span class="status-badge ${status}">${status}</span></td>
      <td class="builds-done"><span>${builds}</span>/4</td>
    </tr>`
  }).join('')

  tb.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const row = allRows.find(r => String(r.id) === tr.dataset.id)
      if (row) openModal(row)
    })
  })
}

// ── Modal ──
function openModal(r) {
  const overlay = document.getElementById('modal-overlay')
  const content = document.getElementById('modal-content')
  const date = r.created_at ? new Date(r.created_at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '—'
  const ackTexts = [
    'This is a job, not a vacation.',
    'Primary 24/7 caretaker for 5–7 students.',
    'Away for two international + one U.S. rotation.',
    "Upholding Alpha's three commitments in the field.",
    'Holding students AND self to high standards.',
    'First responder when things go wrong.',
    'Representing Alpha to communities and partners.',
    'Manager and HoS are aware of application.',
  ]

  content.innerHTML = `
    <div class="modal-header">
      <div>
        <h2>${esc(r.full_name || '—')}</h2>
        <p>${esc(r.role_at_alpha || '')}${r.campus ? ' · ' + esc(r.campus) : ''} · Submitted ${date}</p>
      </div>
      <button class="close-btn" id="close-modal">✕</button>
    </div>

    <div class="modal-section">
      <h3>Personal Info</h3>
      <div class="detail-grid">
        <div class="detail-item"><div class="dl">Email</div><div class="dv">${esc(r.email||'—')}</div></div>
        <div class="detail-item"><div class="dl">Phone</div><div class="dv">${esc(r.phone||'—')}</div></div>
        <div class="detail-item"><div class="dl">Years at Alpha</div><div class="dv">${esc(r.years_at_alpha||'—')}</div></div>
        <div class="detail-item"><div class="dl">Direct Manager</div><div class="dv">${esc(r.direct_manager||'—')}</div></div>
        <div class="detail-item"><div class="dl">Head of School</div><div class="dv">${esc(r.head_of_school||'—')}</div></div>
        <div class="detail-item"><div class="dl">Emergency Contact</div><div class="dv">${esc(r.emergency_contact||'—')}</div></div>
        <div class="detail-item full"><div class="dl">Languages Spoken</div><div class="dv">${esc(r.languages_spoken||'—')}</div></div>
        <div class="detail-item full"><div class="dl">Prior International Travel</div><div class="dv">${esc(r.prior_international_travel||'—')}</div></div>
        <div class="detail-item full"><div class="dl">Developing-World Experience</div><div class="dv">${esc(r.developing_world_experience||'—')}</div></div>
        <div class="detail-item full"><div class="dl">Health Considerations</div><div class="dv">${esc(r.health_considerations||'—')}</div></div>
        <div class="detail-item full"><div class="dl">Family Obligations</div><div class="dv">${esc(r.family_obligations||'—')}</div></div>
      </div>
    </div>

    <div class="modal-section">
      <h3>Builds</h3>
      <div class="detail-grid">
        ${buildLink('Build 1 — Workshop Sprint', r.build1_link)}
        ${buildLink('Build 2 — Design Doc', r.build2_design_link)}
        ${buildLink('Build 2 — Video', r.build2_video_link)}
        ${buildLink('Build 3 — Video', r.build3_video_link)}
        ${buildLink('Build 4 — Language Tape', r.build4_language_link)}
      </div>
    </div>

    <div class="modal-section">
      <h3>References</h3>
      <div class="detail-grid">
        <div class="detail-item"><div class="dl">Reference 1</div><div class="dv">${esc(r.reference1_name||'—')} · ${esc(r.reference1_role||'')} · ${esc(r.reference1_email||'')}</div></div>
        <div class="detail-item"><div class="dl">Reference 2</div><div class="dv">${esc(r.reference2_name||'—')} · ${esc(r.reference2_role||'')} · ${esc(r.reference2_email||'')}</div></div>
        <div class="detail-item full"><div class="dl">Manager Endorsement (${esc(r.manager_endorsement_status||'pending')})</div><div class="dv" style="white-space:pre-wrap">${esc(r.manager_endorsement_text||'—')}</div></div>
        <div class="detail-item"><div class="dl">Endorser</div><div class="dv">${esc(r.endorser_name||'—')} · ${esc(r.endorser_role||'')}</div></div>
        <div class="detail-item"><div class="dl">Signed as</div><div class="dv">${esc(r.applicant_name||'—')}</div></div>
      </div>
    </div>

    <div class="modal-section">
      <h3>Acknowledgments</h3>
      <ul class="ack-list-m">
        ${ackTexts.map((t, i) => `<li style="${r['ack_'+(i+1)] ? '' : 'color:var(--rose);'}">${r['ack_'+(i+1)] ? '' : '✗ '}${t}</li>`).join('')}
      </ul>
    </div>

    <div class="modal-section">
      <h3>Admin Actions</h3>
      <div>
        <select class="status-select" id="status-select">
          <option value="new" ${(r.status||'new')==='new'?'selected':''}>New</option>
          <option value="reviewed" ${r.status==='reviewed'?'selected':''}>Reviewed</option>
          <option value="rejected" ${r.status==='rejected'?'selected':''}>Rejected</option>
        </select>
        <button class="save-btn" id="save-status">Save status</button>
        <span class="saved-msg" id="saved-msg">Saved</span>
      </div>
      <textarea class="note-area" id="admin-note" rows="3" placeholder="Internal notes (not visible to applicant)…">${esc(r.admin_notes||'')}</textarea>
      <button class="save-btn" id="save-note">Save note</button>
    </div>
  `

  document.getElementById('close-modal').addEventListener('click', closeModal)
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal() })

  document.getElementById('save-status').addEventListener('click', async () => {
    const newStatus = document.getElementById('status-select').value
    const { error } = await supabase.from('guide_applications').update({ status: newStatus }).eq('id', r.id)
    if (!error) {
      r.status = newStatus
      const idx = allRows.findIndex(x => x.id === r.id)
      if (idx !== -1) allRows[idx].status = newStatus
      render()
      showSaved()
    }
  })

  document.getElementById('save-note').addEventListener('click', async () => {
    const note = document.getElementById('admin-note').value
    const { error } = await supabase.from('guide_applications').update({ admin_notes: note }).eq('id', r.id)
    if (!error) {
      r.admin_notes = note
      const idx = allRows.findIndex(x => x.id === r.id)
      if (idx !== -1) allRows[idx].admin_notes = note
      showSaved()
    }
  })

  overlay.style.display = 'flex'
}

function showSaved() {
  const msg = document.getElementById('saved-msg')
  if (msg) { msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 2000) }
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none'
}

function buildLink(label, val) {
  if (!val) return `<div class="detail-item"><div class="dl">${label}</div><div class="dv" style="color:var(--dim)">Not submitted</div></div>`
  const isUrl = val.startsWith('http')
  return `<div class="detail-item"><div class="dl">${label}</div><div class="dv">${isUrl ? `<a href="${esc(val)}" target="_blank" rel="noopener">${esc(val)}</a>` : esc(val)}</div></div>`
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
</script>
</body>
</html>
